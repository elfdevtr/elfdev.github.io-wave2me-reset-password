<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wave2Me Şifre Sıfırlama / Reset Password</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 40px 16px; line-height: 1.5; color: #1C2826; background: #F4F7F6; }
    .card { background: #FFFFFF; border-radius: 20px; padding: 28px 20px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06); }
    h1 { color: #1E6F5C; font-size: 1.4rem; margin: 0 0 12px; text-align: center; }
    .icon { font-size: 52px; text-align: center; }
    p { margin: 8px 0; }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    input { width: 100%; box-sizing: border-box; font-size: 1rem; padding: 12px; border: 1px solid #D0DDD8; border-radius: 10px; }
    ul { padding-left: 20px; margin: 10px 0; color: #5C6B67; font-size: 0.9rem; }
    li.ok { color: #2E7D32; }
    button { width: 100%; margin-top: 20px; padding: 14px; font-size: 1rem; font-weight: 700; color: #FFFFFF; background: #1E6F5C; border: none; border-radius: 12px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    .error { color: #D32F2F; margin-top: 12px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <!-- Bağlantı doğrulanırken -->
    <div id="loading"><p data-tr="Bağlantı doğrulanıyor..." data-en="Verifying the link..."></p></div>

    <!-- Yeni şifre formu -->
    <form id="form" class="hidden">
      <h1 data-tr="Yeni şifrenizi belirleyin" data-en="Set your new password"></h1>
      <label for="password" data-tr="Yeni şifre" data-en="New password"></label>
      <input id="password" type="password" autocomplete="new-password" required>
      <ul>
        <li id="r-length" data-tr="En az 6 karakter" data-en="At least 6 characters"></li>
        <li id="r-upper" data-tr="En az 1 büyük harf (A-Z)" data-en="At least 1 uppercase letter (A-Z)"></li>
        <li id="r-lower" data-tr="En az 1 küçük harf (a-z)" data-en="At least 1 lowercase letter (a-z)"></li>
        <li id="r-number" data-tr="En az 1 rakam (0-9)" data-en="At least 1 number (0-9)"></li>
        <li id="r-special" data-tr="En az 1 özel karakter (!@#$%^&*)" data-en="At least 1 special character (!@#$%^&*)"></li>
      </ul>
      <label for="confirm" data-tr="Yeni şifre (tekrar)" data-en="Confirm new password"></label>
      <input id="confirm" type="password" autocomplete="new-password" required>
      <button id="submit" type="submit" disabled data-tr="Şifreyi Kaydet" data-en="Save Password"></button>
      <p id="form-error" class="error hidden"></p>
    </form>

    <!-- Başarılı -->
    <div id="done" class="hidden">
      <div class="icon">✅</div>
      <h1 data-tr="Şifreniz güncellendi" data-en="Your password has been updated"></h1>
      <p data-tr="Uygulamaya dönüp e-posta adresiniz ve yeni şifrenizle giriş yapabilirsiniz." data-en="Return to the app and sign in with your email and new password."></p>
    </div>

    <!-- Geçersiz / süresi dolmuş bağlantı -->
    <div id="invalid" class="hidden">
      <div class="icon">⚠️</div>
      <h1 data-tr="Bağlantı geçersiz veya süresi dolmuş" data-en="The link is invalid or has expired"></h1>
      <p data-tr="Uygulamadaki giriş ekranından &quot;Şifremi unuttum&quot; ile yeni bir bağlantı isteyin." data-en="Request a new link from &quot;Forgot password?&quot; on the app's sign-in screen."></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    // Herkese açık (publishable) anahtar; uygulamadakiyle aynı
    var SUPABASE_URL = 'https://pcjvwjxhuymsdkcdjkpf.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_RU9pTQA_zuTVa9Xuc9P4rw_qBu6nElt';
    var lang = (navigator.language || '').toLowerCase().indexOf('tr') === 0 ? 'tr' : 'en';
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-tr]').forEach(function (el) { el.innerHTML = el.getAttribute('data-' + lang); });

    function show(id) {
      ['loading', 'form', 'done', 'invalid'].forEach(function (s) {
        document.getElementById(s).classList.toggle('hidden', s !== id);
      });
    }

    // Uygulamadaki şifre kurallarıyla aynı
    var rules = {
      'r-length': function (p) { return p.length >= 6; },
      'r-upper': function (p) { return /[A-Z]/.test(p); },
      'r-lower': function (p) { return /[a-z]/.test(p); },
      'r-number': function (p) { return /[0-9]/.test(p); },
      'r-special': function (p) { return /[!@#$%^&*(),.?":{}|<>]/.test(p); }
    };
    var password = document.getElementById('password');
    var confirmInput = document.getElementById('confirm');
    var submit = document.getElementById('submit');
    function validate() {
      var p = password.value, allOk = true;
      Object.keys(rules).forEach(function (id) {
        var ok = rules[id](p);
        document.getElementById(id).classList.toggle('ok', ok);
        allOk = allOk && ok;
      });
      submit.disabled = !(allOk && p === confirmInput.value);
    }
    password.addEventListener('input', validate);
    confirmInput.addEventListener('input', validate);

    // Süresi dolmuş veya kullanılmış bağlantıda Supabase hatayı adreste döndürür
    var hash = new URLSearchParams(window.location.hash.slice(1));
    if (hash.get('error') || hash.get('error_code')) {
      show('invalid');
    } else {
      var client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { flowType: 'implicit', detectSessionInUrl: true, persistSession: false }
      });
      var ready = false;
      client.auth.onAuthStateChange(function (event, session) {
        if (session && (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN' || event === 'INITIAL_SESSION')) {
          ready = true;
          show('form');
        }
      });
      // Bağlantıda oturum bilgisi yoksa (doğrudan açıldıysa) geçersiz say
      setTimeout(function () { if (!ready) show('invalid'); }, 4000);

      document.getElementById('form').addEventListener('submit', function (e) {
        e.preventDefault();
        submit.disabled = true;
        var errorEl = document.getElementById('form-error');
        errorEl.classList.add('hidden');
        client.auth.updateUser({ password: password.value }).then(function (res) {
          if (res.error) {
            errorEl.textContent = lang === 'tr'
              ? 'Şifre kaydedilemedi: ' + res.error.message
              : 'Could not save the password: ' + res.error.message;
            errorEl.classList.remove('hidden');
            submit.disabled = false;
            return;
          }
          client.auth.signOut();
          show('done');
        });
      });
    }
  </script>
</body>
</html>
